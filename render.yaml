services:
  - type: web
    name: relaypulse
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/relaypulse.db
      - key: LOG_LEVEL
        value: info
      - key: LLM_PROVIDER
        value: rule_fallback

